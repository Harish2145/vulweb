<!doctype html>
<html><head><title>Upload</title></head>
<body style="font-family:monospace;max-width:600px;margin:40px auto">
{% if mode == "pickle" %}
<h2>Profile Import (pickle)</h2>
<form method="post" action="/profile/import">
  <textarea name="data" rows="6" cols="60" placeholder="base64 pickle blob"></textarea><br><br>
  <button type="submit">Import</button>
</form>
{% else %}
<h2>File Upload</h2>
<form method="post" action="/upload" enctype="multipart/form-data">
  <input type="file" name="file"><br><br>
  <button type="submit">Upload</button>
</form>
{% endif %}
<a href="/">home</a>
</body></html>
